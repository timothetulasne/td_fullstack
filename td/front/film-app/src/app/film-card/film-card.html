<div>
    <p>Id: {{ film().id }}</p>
    <p>Titre: {{ film().titre }}</p>
    <p>Réalisateur: {{ film().realisateur }}</p>
    <p>Date de sortie: {{ film().dateSortie }}</p>
    <p>Genre: {{ film().genre }}</p>

    <form #f="ngForm">
        <p>Titre saisi: {{ titre() }}</p>
        <input name="titre" [(ngModel)]="titre" />
        <button [disabled]="f.invalid" (click)="effacerTitre()">Effacer le champ</button>
    </form>
</div>
